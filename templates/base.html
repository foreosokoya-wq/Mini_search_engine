<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Mini Search Engine</title>
        <link rel="stylesheet" href="{{url_for('static', filename='main.css')}}">
    </head>
    <body>
        <style>
        :root {
        --bg-color: #f7ddf0;
        --text-color: #000000;
        --card-bg: #ffffff;
        --a-bg: black;
        --url-bg: #006621;
        --title-bg: #1a0dab;
        --snippet-bg: #4d5156;
        --result-bg: white;
        --input-bg: #ffffff;
        --text-color: #000000;
        --shadow: rgba(0, 0, 0, 0.61);
        }

        .dark {
        --bg-color: #181717;
        --text-color: #eaeaea;
        --card-bg: #5a5555;
        --a-bg: white;
        --url-bg: #8ffdb2;
        --title-bg: #bab4ff;
        --snippet-bg: #ffffff;
        --result-bg: rgb(1, 1, 39);
        --input-bg: #302f2f;
        --text-color: #eaeaea;
        --shadow: rgba(255, 255, 255, 0.842);
        }

        body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: Arial, sans-serif;
        padding: 30px;
        }

        .result-card {
        background: var(--card-bg);
        padding: 15px;
        border-radius: 8px;
        }

        </style>
        <nav class="navlinks">
            <a href="/search">Search</a>
            <a href="/about">About</a>
        </nav>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
        <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");

            // save preference
            if (document.body.classList.contains("dark")) {
            localStorage.setItem("theme", "dark");
            } else {
            localStorage.setItem("theme", "light");
            }
        }

        // load theme on refresh
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
        }
        </script>

    </body>
</html>
